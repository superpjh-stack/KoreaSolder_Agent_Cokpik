services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: goryeo_solder
      POSTGRES_USER: goryeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - goryeo_solder_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goryeo -d goryeo_solder"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: https://github.com/superpjh-stack/KoreaSolder_Agent_Cokpik.git#main
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://goryeo:${POSTGRES_PASSWORD:-change-me}@postgres:5432/goryeo_solder
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    ports:
      - "8506:8501"
volumes:
  goryeo_solder_postgres:
